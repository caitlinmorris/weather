# we.ather relay on Fly.io. (Fly app names are DNS labels — no dots allowed —
# hence "we-ather-relay".) Deploy steps (one time):
#   fly launch --no-deploy          # accept this config, pick a region
#   python -m presence.relay.mktoken caitlin   # and one per friend
#   fly secrets set RELAY_TOKENS='{"caitlin": "<hash>", "dan": "<hash>"}'
#   fly deploy
# State is in-memory by design (see docs/security-model.md): a restart just
# means everyone re-appears on their next push, within minutes.

app = "we-ather-relay"
primary_region = "ewr"

[build]
  dockerfile = "presence/relay/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # polling every 60s needs the machine warm
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
