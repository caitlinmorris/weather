app = 'we-ather-relay'
primary_region = 'ewr'

[build]
  dockerfile = 'presence/relay/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
