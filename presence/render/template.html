<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>we.ather — replay sketch</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14; --panel: #0e1219; --border: #222a3a;
    --text: #b8c0cc; --muted: #99a3b4; --dim: #5d6678;
    --btn: #9aa4b4; --btn-border: #2e3648;
    --btn-hover: #dde3ec; --btn-border-hover: #47506a;
    --tip-bg: rgba(18,22,32,.97); --tip-border: #2a3346;
    --tip-text: #c3cbd8; --tip-who: #e4e9f1; --tip-dim: #8b95a7;
    --tick: #4d5a7a; --accent: #566180;
  }
  body.light {
    color-scheme: light;
    --bg: #eef0f3; --panel: #fafbfc; --border: #d9dee6;
    --text: #3a4250; --muted: #5f6a7a; --dim: #8a93a2;
    --btn: #5f6a7a; --btn-border: #c9d0da;
    --btn-hover: #1f2733; --btn-border-hover: #9aa4b4;
    --tip-bg: rgba(255,255,255,.98); --tip-border: #d0d6df;
    --tip-text: #46505e; --tip-who: #1f2733; --tip-dim: #77818f;
    --tick: #a8b2c2; --accent: #8a93a2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  #widget {
    width: 400px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  #topbar .title { color: var(--dim); font-size: 11px; }
  #topbar .controls { display: flex; gap: 6px; }
  #topbar button {
    background: none; border: 1px solid var(--btn-border); color: var(--btn);
    border-radius: 4px; padding: 1px 8px; cursor: pointer;
    font: inherit; font-size: 11px;
  }
  #topbar button:hover { color: var(--btn-hover); border-color: var(--btn-border-hover); }
  #field { width: 100%; height: 92px; display: block; cursor: crosshair; }
  #keyrow {
    display: none; text-align: center; color: var(--muted);
    font-size: 10.5px; padding: 2px 0 1px;
  }
  #keyrow.show { display: block; }
  #keyrow i { font-style: normal; }
  /* Dot and its label never wrap apart. */
  #keyrow .ki { white-space: nowrap; margin: 0 3px; display: inline-block; }
  #weather {
    text-align: center; color: var(--muted); font-style: italic;
    font-size: 11px; min-height: 17px; margin-top: 2px;
  }
  #hud { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  #play {
    background: none; border: 1px solid var(--btn-border); color: var(--btn);
    border-radius: 4px; padding: 1px 8px; cursor: pointer; font: inherit;
  }
  #play:hover { color: var(--btn-hover); border-color: var(--btn-border-hover); }
  #scrubwrap { position: relative; flex: 1; display: flex; }
  #scrub { width: 100%; accent-color: var(--accent); }
  #ticks {
    position: absolute; left: 0; right: 0; top: -4px; height: 4px;
    pointer-events: none;
  }
  .tick { position: absolute; width: 1px; height: 4px; background: var(--tick); }
  #clock { min-width: 108px; text-align: right; color: var(--muted); font-size: 11px; }
  #caption { color: var(--dim); font-size: 11px; text-align: center; }
  #tip {
    position: fixed; pointer-events: none; display: none; max-width: 280px;
    background: var(--tip-bg); border: 1px solid var(--tip-border);
    border-radius: 6px; padding: 7px 10px; color: var(--tip-text); font-size: 11px;
  }
  #tip .who { color: var(--tip-who); }
  #tip .micro { color: var(--tip-text); }
  #tip .tags { color: var(--tip-dim); margin-top: 2px; }
  #tip .gist { color: var(--tip-dim); margin-top: 2px; }
  body.live #hud { display: none; }
  body.live { justify-content: flex-start; padding-top: 8px; }
</style>
</head>
<body>
<div id="widget">
  <div id="topbar">
    <span class="title">we.ather</span>
    <span class="controls">
      <button id="view" title="field: anonymous weather · dots: per-person"></button>
      <button id="key" title="toggle color key">key</button>
      <button id="theme" title="light / dark">◐</button>
      <button id="level" title="how much 'what' a hover reveals"></button>
    </span>
  </div>
  <canvas id="field"></canvas>
  <div id="keyrow"></div>
  <div id="weather"></div>
  <div id="hud">
    <button id="play">▶</button>
    <div id="scrubwrap"><div id="ticks"></div>
      <input id="scrub" type="range" min="0" max="1000" value="1000"></div>
    <span id="clock"></span>
  </div>
</div>
<div id="caption"></div>
<div id="tip"></div>
<script>
const DATA = __DATA__;

const LIVE = location.hash === "#live";
const HALF_LIFE_H = LIVE ? 3 : 48;      // dots-view decay
const ACTIVE_H = LIVE ? 0.75 : 2;
const GAP_SECONDS = 0.8;
const SESSION_PRE_MS = 40 * 60e3, SESSION_POST_MS = 10 * 60e3;

// Field view: right edge = now; the window drifts left one cell at a time.
// 4h across ~74 cells = one cell every ~3 min: near-realtime texture.
const FIELD_WINDOW_H = 4;
const CELL = 5;
const EVENT_FRESH_H = 1;   // outlined "new event" blocks dissolve after this
const NEW_EVENT_GAP_H = 4; // activity after this gap counts as a fresh event
const NOISE_DENSITY = 0.07;

const THEMES = {
  // writing is the palette's only warm-neutral (parchment — prose as paper),
  // keeping all seven values hue-distinct; shaping's cyan is saturated to
  // pull it clear of anything blue.
  dark: {
    label: "#7a8496", outline: "#dde3ec", noise: "#8b93a3",
    hues: {
      exploring: "#a78bfa", shaping: "#22d3ee", building: "#6ee7a0",
      debugging: "#fbbf24", polishing: "#f9a8d4", writing: "#d9b380",
      unknown: "#8b93a3",
    },
  },
  light: {
    label: "#77818f", outline: "#1f2733", noise: "#6b7280",
    hues: {
      exploring: "#7c5cd6", shaping: "#0891b2", building: "#1f9d5a",
      debugging: "#b7791f", polishing: "#d6588e", writing: "#7a6230",
      unknown: "#6b7280",
    },
  },
};

const LEVELS = [
  { key: "presence", micro: false, tags: false, gist: false, name: false },
  { key: "topic", micro: true, tags: false, gist: false, name: false },
  { key: "topic+", micro: true, tags: true, gist: true, name: true },
];
const VIEWS = ["field", "dots"];

const prefs = window.localStorage;
let level = Math.min(+(prefs.getItem("presence.level") ?? 1), LEVELS.length - 1);
let theme = prefs.getItem("presence.theme") === "light" ? "light" : "dark";
let showKey = prefs.getItem("presence.key") === "1";
let view = VIEWS.includes(prefs.getItem("presence.view")) ? prefs.getItem("presence.view") : "field";

DATA.forEach(p => {
  p.states.forEach(s => {
    s.ms = Date.parse(s.t);
    if (s.phase === "writing_up") s.phase = "writing";  // legacy pre-v3 value
  });
  // Relay rings arrive in push order, not time order; stateAt() and
  // fresh-event marking both require chronology.
  p.states.sort((a, b) => a.ms - b.ms);
  // Fast-path presence: newest heartbeat across states (timestamps only).
  p.aliveMs = Math.max(...p.states.map(s =>
    s.last_active ? Date.parse(s.last_active) : s.ms));
});
DATA.sort((a, b) => a.person.localeCompare(b.person));

// Fresh-event marking: first activity, return after a gap, or topic change.
DATA.forEach(p => {
  let prev = null;
  for (const s of p.states) {
    s.person = p.person;
    s.fresh = !prev
      || (s.ms - prev.ms) > NEW_EVENT_GAP_H * 36e5
      || (s.tags[0] || "") !== (prev.tags[0] || "");
    prev = s;
  }
});
const ALL_STATES = DATA.flatMap(p => p.states).sort((a, b) => a.ms - b.ms);

// --- activity-warped time (replay mode only) ------------------------------------
const raw = ALL_STATES.map(s => [s.ms - SESSION_PRE_MS, s.ms + SESSION_POST_MS])
  .sort((a, b) => a[0] - b[0]);
const spans = [];
for (const [a, b] of raw) {
  const last = spans[spans.length - 1];
  if (last && a <= last[1]) last[1] = Math.max(last[1], b);
  else spans.push([a, b]);
}
const pieces = [];
let playClock = 0;
spans.forEach(([a, b], i) => {
  if (i > 0) {
    pieces.push({ ra: spans[i - 1][1], rb: a, pa: playClock, pb: playClock += GAP_SECONDS });
  }
  const sceneSeconds = Math.min(4, 2 + ((b - a) / 36e5) * 0.8);
  pieces.push({ ra: a, rb: b, pa: playClock, pb: playClock += sceneSeconds });
});
if (!pieces.length) pieces.push({ ra: 0, rb: 1, pa: 0, pb: playClock = 1 });
const PLAY_TOTAL = playClock;

const toReal = ps => {
  for (const q of pieces)
    if (ps <= q.pb) return q.ra + (q.rb - q.ra) * ((ps - q.pa) / (q.pb - q.pa));
  return pieces[pieces.length - 1].rb;
};
const toPlay = ms => {
  for (const q of pieces)
    if (ms <= q.rb) return q.pa + (q.pb - q.pa) * Math.max(0, (ms - q.ra) / (q.rb - q.ra));
  return PLAY_TOTAL;
};

// --- widget ---------------------------------------------------------------------
const field = document.getElementById("field"), ctx = field.getContext("2d");
const scrub = document.getElementById("scrub"), clock = document.getElementById("clock");
const playBtn = document.getElementById("play"), tip = document.getElementById("tip");
const levelBtn = document.getElementById("level"), themeBtn = document.getElementById("theme");
const keyBtn = document.getElementById("key"), keyRow = document.getElementById("keyrow");
const viewBtn = document.getElementById("view");
let playing = false, lastFrame = 0, mouse = { x: -1, y: -1 };

if (LIVE) {
  document.body.classList.add("live");
  // The page's own mtime is the build stamp — self-contained, no
  // placeholder contract with build_page (version skew bit us once).
  const built = new Date(document.lastModified);
  document.getElementById("caption").textContent =
    "live · page built " +
    built.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
    " · field spans 4h";
  // Cache-busted reload: WKWebView serves cached file:// content on plain
  // location.reload(), so the widget would silently freeze at launch-time
  // data. A fresh query string forces a disk read every cycle.
  setInterval(() => {
    location.replace(location.pathname + "?v=" + Date.now() + location.hash);
  }, 60e3);
} else {
  document.getElementById("caption").textContent =
    "replay: sessions play as short scenes, gaps compressed";
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  field.width = field.clientWidth * dpr; field.height = field.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

document.getElementById("ticks").innerHTML = ALL_STATES
  .map(s => `<div class="tick" style="left:${(toPlay(s.ms) / PLAY_TOTAL * 100).toFixed(2)}%"></div>`)
  .join("");

function hash(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}
// Deterministic PRNG so the field texture is identical across the live
// page's 2-minute self-reloads — the weather must not re-roll itself.
function mulberry32(seed) {
  let a = Math.floor(seed * 4294967296);
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function stateAt(p, t) {
  let cur = null;
  for (const s of p.states) { if (s.ms <= t) cur = s; else break; }
  return cur;
}

const microOf = s => s.micro || (s.tags[0] ? s.tags[0] : "");
const scrubT = () => LIVE ? Date.now() : toReal((+scrub.value / 1000) * PLAY_TOTAL);

let weatherCache = "";
let hoverBlocks = [];   // field view hit targets, rebuilt each frame

// --- field view -------------------------------------------------------------------
function drawFieldView(t, now) {
  const T = THEMES[theme];
  const W = field.clientWidth, H = field.clientHeight;
  const cols = Math.floor(W / CELL), rows = Math.floor(H / CELL);
  const slotMs = (FIELD_WINDOW_H * 36e5) / cols;
  hoverBlocks = [];
  const blobTargets = [];  // every blob is inspectable; events keep priority

  // Ambient noise: keyed to ABSOLUTE time buckets so texture scrolls with
  // the window instead of re-rolling. Dim, neutral, sparse.
  ctx.fillStyle = T.noise;
  for (let c = 0; c < cols; c++) {
    const bucket = Math.floor((t - (cols - 1 - c) * slotMs) / slotMs);
    for (let r = 0; r < rows; r++) {
      const rnd = mulberry32(hash(`n${bucket}·${r}`))();
      if (rnd < NOISE_DENSITY) {
        ctx.globalAlpha = 0.05 + 0.05 * rnd / NOISE_DENSITY;
        ctx.fillRect(c * CELL, r * CELL, CELL - 1, CELL - 1);
      }
    }
  }

  // Activity blobs: column = when, lane = topic (recurring work recurs at
  // the same height), hue = phase. No identity anywhere at this layer.
  for (const s of ALL_STATES) {
    const ageH = (t - s.ms) / 36e5;
    if (ageH < 0 || ageH > FIELD_WINDOW_H) continue;
    const col = cols - 1 - Math.floor((ageH / FIELD_WINDOW_H) * cols);
    const lane = 2 + Math.floor(hash(s.tags[0] || s.gist || "?") * (rows - 6));
    const hue = T.hues[s.phase] || T.hues.unknown;
    const fade = 0.3 + 0.7 * (1 - ageH / FIELD_WINDOW_H);
    const rnd = mulberry32(hash(s.person + s.t));

    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const weight = 1 - (Math.abs(dx) * 0.35 + Math.abs(dy) * 0.28);
        if (rnd() > weight) continue;
        const c = col + dx, r = lane + dy;
        if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
        const shimmer = 1 + 0.08 * Math.sin(now / 900 + hash(`${c},${r}`) * 40);
        ctx.globalAlpha = Math.min(1, fade * weight * shimmer);
        ctx.fillStyle = hue;
        ctx.fillRect(c * CELL, r * CELL, CELL - 1, CELL - 1);
      }
    }

    blobTargets.push({ cx: col * CELL + CELL / 2, cy: lane * CELL + CELL / 2, s });

    // Fresh events crystallize: a larger outlined block, the loudest hover
    // target. It dissolves into ordinary weather after EVENT_FRESH_H.
    if (s.fresh && ageH <= EVENT_FRESH_H) {
      const x = Math.min(col, cols - 2) * CELL, y = Math.min(lane, rows - 2) * CELL;
      const size = CELL * 2 - 1;
      ctx.globalAlpha = Math.min(1, fade + 0.15);
      ctx.fillStyle = hue;
      ctx.fillRect(x, y, size, size);
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = T.outline;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      hoverBlocks.push({ x, y, w: size, h: size, s });
    }
  }
  ctx.globalAlpha = 1;

  const hit = hoverBlocks.find(b =>
    mouse.x >= b.x - 2 && mouse.x <= b.x + b.w + 2 &&
    mouse.y >= b.y - 2 && mouse.y <= b.y + b.h + 2);
  if (hit) return { s: hit.s, X: hit.x + hit.w / 2, Y: hit.y };

  // No event block under the cursor: any blob within reach is inspectable
  // (most recent wins when blobs overlap). Passive view stays anonymous;
  // the dial still decides what a hover may reveal.
  let best = null, bestD = 14;
  for (const b of blobTargets) {
    const d = Math.hypot(mouse.x - b.cx, mouse.y - b.cy);
    if (d < bestD || (best && d === bestD && b.s.ms > best.s.ms)) {
      best = b; bestD = Math.min(d, bestD);
    }
  }
  return best ? { s: best.s, X: best.cx, Y: best.cy } : null;
}

// --- dots view ---------------------------------------------------------------------
function slotX(i) {
  const w = field.clientWidth, pad = 46, n = DATA.length;
  return n === 1 ? w / 2 : pad + (i * (w - 2 * pad)) / (n - 1);
}

function drawDotsView(t, now) {
  const T = THEMES[theme];
  const H = field.clientHeight, y0 = H * 0.42;
  let hovered = null;

  DATA.forEach((p, i) => {
    const s = stateAt(p, t);
    const x = slotX(i);

    ctx.fillStyle = T.label;
    ctx.font = "10px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText(p.person.toLowerCase(), x, H - 6);

    if (!s) return;
    const aliveMs = LIVE ? Math.max(s.ms, p.aliveMs || 0) : s.ms;
    const ageH = (t - aliveMs) / 36e5;
    const glow = Math.pow(0.5, ageH / HALF_LIFE_H);
    const w = now / 1000;
    const X = x + Math.sin(w * 0.45 + hash(p.person) * 9) * 2.5 * glow;
    const Y = y0 + Math.cos(w * 0.35 + hash(p.person) * 7) * 2.0 * glow;

    const hue = T.hues[s.phase] || T.hues.unknown;
    const rad = 3.5 + 5.5 * glow;
    const grad = ctx.createRadialGradient(X, Y, 0, X, Y, rad * 3);
    grad.addColorStop(0, hue + "cc");
    grad.addColorStop(1, hue + "00");
    ctx.globalAlpha = Math.max(glow, 0.05);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(X, Y, rad * 3, 0, 7); ctx.fill();
    ctx.fillStyle = hue;
    ctx.beginPath(); ctx.arc(X, Y, rad * 0.6, 0, 7); ctx.fill();
    if (["open", "seeking_input"].includes(s.openness)) {
      ctx.strokeStyle = hue + "55"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X, Y, rad * 1.8, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (Math.hypot(mouse.x - X, mouse.y - Y) < 26) hovered = { s, X, Y, person: p.person };
  });
  return hovered;
}

// --- shared frame loop ------------------------------------------------------------
function draw(now) {
  requestAnimationFrame(draw);
  if (playing && !LIVE) {
    const dt = (now - lastFrame) / 1000;
    scrub.value = Math.min(1000, +scrub.value + (dt / PLAY_TOTAL) * 1000);
    if (+scrub.value >= 1000) togglePlay();
  }
  lastFrame = now;

  const t = scrubT();
  ctx.clearRect(0, 0, field.clientWidth, field.clientHeight);
  const hovered = view === "field" ? drawFieldView(t, now) : drawDotsView(t, now);

  let active = 0, recent = 0;
  const phases = [];
  for (const p of DATA) {
    const s = stateAt(p, t);
    if (!s) continue;
    // Live aliveness uses the heartbeat (last transcript activity), which
    // leads extraction by several minutes; replay scrubbing stays on state
    // time so history isn't contaminated by a present-day heartbeat.
    const aliveMs = LIVE ? Math.max(s.ms, p.aliveMs || 0) : s.ms;
    const ageH = (t - aliveMs) / 36e5;
    if (ageH < ACTIVE_H) active++; else if (ageH < 24) recent++;
    if (ageH < 24) phases.push(s.phase);
  }
  // Weather-metaphor phrasing, deliberately not "working": activity makes
  // the shared weather rather than being monitored by it.
  let weather = active ? active + " making weather"
    : recent ? recent + " in the air today" : "still air";
  const mode = majority(phases);
  if (mode && mode !== "unknown") weather += " · mostly " + mode.replace("_", " ");
  if (weather !== weatherCache) {
    document.getElementById("weather").textContent = weather;
    weatherCache = weather;
  }

  if (!LIVE) {
    clock.textContent = new Date(t).toLocaleString(undefined,
      { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  const L = LEVELS[level];
  if (hovered && (L.micro || L.name || view === "dots")) {
    const box = field.getBoundingClientRect();
    tip.style.display = "block";
    tip.style.left = Math.min(box.left + hovered.X + 16, innerWidth - 296) + "px";
    tip.style.top = (box.top + hovered.Y - 10) + "px";
    let html = "";
    // Identity rules: dots view names its slots inherently; the field stays
    // anonymous unless the dial is at topic+ (L.name).
    const who = view === "dots" ? hovered.person : (L.name ? hovered.s.person : null);
    if (who) html += '<span class="who">' + esc(who) + "</span>";
    if (L.micro && microOf(hovered.s))
      html += (who ? " · " : "") + '<span class="micro">' + esc(microOf(hovered.s)) + "</span>";
    if (L.tags) html += '<div class="tags">' + esc(hovered.s.tags.join(" · ")) + "</div>";
    if (L.gist) html += '<div class="gist">' + esc(hovered.s.gist) + "</div>";
    tip.innerHTML = html || '<span class="micro">recent activity</span>';
  } else tip.style.display = "none";
}

function majority(arr) {
  const c = {}; let best = null;
  for (const v of arr) { c[v] = (c[v] || 0) + 1; if (!best || c[v] > c[best]) best = v; }
  return best && c[best] >= 2 ? best : null;
}
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function togglePlay() { playing = !playing; playBtn.textContent = playing ? "❚❚" : "▶"; }
playBtn.onclick = () => { if (+scrub.value >= 1000) scrub.value = 0; togglePlay(); };
field.onmousemove = e => {
  const b = field.getBoundingClientRect();
  mouse = { x: e.clientX - b.left, y: e.clientY - b.top };
};
field.onmouseleave = () => { mouse = { x: -1, y: -1 }; };

function setLevel(n) {
  level = n;
  levelBtn.textContent = "signal: " + LEVELS[n].key;
  prefs.setItem("presence.level", String(n));
}
levelBtn.onclick = () => setLevel((level + 1) % LEVELS.length);
setLevel(level);

function setView(name) {
  view = name;
  viewBtn.textContent = "view: " + name;
  prefs.setItem("presence.view", name);
}
viewBtn.onclick = () => setView(view === "field" ? "dots" : "field");
setView(view);

function setTheme(name) {
  theme = name;
  document.body.classList.toggle("light", theme === "light");
  prefs.setItem("presence.theme", theme);
  renderKey();
}
function renderKey() {
  keyRow.innerHTML = Object.entries(THEMES[theme].hues)
    .filter(([k]) => k !== "unknown")
    .map(([k, v]) => '<span class="ki"><i style="color:' + v + '">●</i> '
      + k.replace("_", " ") + "</span>")
    .join(" ");
  keyRow.classList.toggle("show", showKey);
}
themeBtn.onclick = () => setTheme(theme === "dark" ? "light" : "dark");
setTheme(theme);

keyBtn.onclick = () => {
  showKey = !showKey;
  prefs.setItem("presence.key", showKey ? "1" : "0");
  renderKey();
};
renderKey();

requestAnimationFrame(draw);
</script>
</body>
</html>
